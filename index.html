<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>共生型手続き生成システム v0.1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- ヘッダー -->
        <header class="app-header">
            <div class="header-title">
                <h1>共生型手続き生成システム</h1>
                <span class="version">v0.1</span>
            </div>
            <div class="header-status">
                <span class="dot"></span>
                <span class="time">農村の道端</span>
            </div>
        </header>

        <!-- メインコンテンツ領域 -->
        <main class="main-content">
            <!-- 背景・ビジュアルセクション（静かで寂れた西洋農村のイメージ） -->
            <section class="visual-section">
                <!-- 添付いただいたイメージ画像をベースにした雰囲気のある農村風景 -->
                <div class="world-image-container">
                    <img src="https://placehold.co/800x600/d9c3a3/5a4a3b?text=Quiet+Western+Rural+Landscape" 
                         alt="静かな西洋農村の風景" 
                         class="scene-bg-img"
                         onerror="this.src='https://placehold.co/600x400/e3d7c3/3d342b?text=Rural+Landscape'">
                </div>
                <div class="scene-caption">
                    <h2>静かな農村の午後</h2>
                    <p>道端に、あの子の姿が見える。</p>
                </div>
            </section>

            <!-- インタラクティブ対話領域（かわい子ちゃんとの初期対話 / 先生はまだ登場しない） -->
            <section class="dialogue-section">
                <div class="character-box">
                    <div class="avatar-area">
                        <!-- かわい子ちゃんのイメージアバターアイコン -->
                        <div class="avatar-placeholder cute">
                            <span class="avatar-emoji">👧</span>
                        </div>
                    </div>
                    <div class="speech-bubble">
                        <span class="speaker-name">かわい子ちゃん</span>
                        <p>……あ、こんにちは。こんな静かな農村に、だれか来たんだね。ねえ、ここで何をして遊ぶの……？</p>
                    </div>
                </div>
                <div class="action-panel">
                    <button class="primary-btn" id="generate-btn">最初のプロシージャ（手続き）を生成する</button>
                </div>
            </section>
        </main>

        <!-- フッターナビゲーション（iPhone SE等で完全に見切れないよう安全領域を確保） -->
        <nav class="app-nav">
            <button class="nav-item active">
                <span class="nav-icon">🌾</span>
                <span class="nav-label">農村の道端</span>
            </button>
            <button class="nav-item" id="nav-log">
                <span class="nav-icon">📜</span>
                <span class="nav-label">ログ</span>
            </button>
            <button class="nav-item" id="nav-girl">
                <span class="nav-icon">👧</span>
                <span class="nav-label">かわい子ちゃん</span>
            </button>
            <button class="nav-item" id="nav-settings">
                <span class="nav-icon">⚙️</span>
                <span class="nav-label">設定</span>
            </button>
        </nav>
    </div>

    <script src="main.js"></script>
</body>
</html>

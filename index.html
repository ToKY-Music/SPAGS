<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>共生型手続き生成システム v0.1</title>
<link rel="stylesheet" href="style.css">
<!-- Three.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div class="app-container">
<!-- ヘッダー -->
<header class="app-header">
<div class="header-title">
<h1>共生型手続き生成システム</h1>
<span class="version">v0.1</span>
</div>
<div class="header-status">
<span class="dot"></span>
<span class="time">2026年 10月4日 09:34</span>
</div>
</header>
<!-- メインコンテンツ領域 -->
<main class="main-content">
<!-- 3D / 背景ビジュアル領域（寂れた西洋農村の雰囲気） -->
<section id="canvas-container" class="visual-section">
<!-- Three.js Canvasがここに挿入されます -->
<div class="atmosphere-overlay"></div>
<div class="scene-caption">
<h2>静かな農村の午後</h2>
<p>関係性の輪郭が、ゆっくりと結ばれていく。</p>
</div>
</section>
<!-- インタラクティブ対話・レクチャー領域 -->
<section class="dialogue-section">
<div class="teacher-box">
<div class="avatar-area">
<div class="avatar-placeholder">先生</div>
</div>
<div class="speech-bubble">
<p>こんにちは！今日は『構造』と『プロセス』の関係性について、圏論的な視点からお話ししますね。</p>
</div>
</div>
<div class="action-panel">
<button class="primary-btn" id="generate-btn">手続きを生成する</button>
</div>
</section>
</main>
<!-- フッターナビゲーション（iPhone SE等で押しやすい下部バー） -->
<nav class="app-nav">
<button class="nav-item active">
<span class="nav-icon">🌾</span>
<span class="nav-label">ダッシュボード</span>
</button>
<button class="nav-item">
<span class="nav-icon">📜</span>
<span class="nav-label">ログ</span>
</button>
<button class="nav-item">
<span class="nav-icon">👧</span>
<span class="nav-label">かわい子ちゃん</span>
</button>
<button class="nav-item">
<span class="nav-icon">📖</span>
<span class="nav-label">先生のレクチャー</span>
</button>
</nav>
</div>
<script src="main.js"></script>
</body>
</html>
